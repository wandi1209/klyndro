name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          if [[ -n "${ANDROID_HOME:-}" && -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Run repository security audit
        run: ./scripts/audit-repo.sh

      - name: Run unit test suites
        run: ./scripts/test-all.sh

      - name: Build macOS Debug app
        run: xcodebuild -project apps/macos/Klyndro.xcodeproj -scheme Klyndro -configuration Debug build

      - name: Build Android Debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --console=plain
