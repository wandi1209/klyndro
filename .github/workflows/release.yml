name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/release'
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          if [[ -n "${ANDROID_HOME:-}" && -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Run repository security audit
        run: ./scripts/audit-repo.sh

      - name: Prepare Android signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KLYNDRO_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            keystore_path="${{ runner.temp }}/klyndro-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore_path"
            echo "KLYNDRO_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"
          fi

      - name: Build Android release
        env:
          KLYNDRO_KEYSTORE_PASSWORD: ${{ secrets.KLYNDRO_KEYSTORE_PASSWORD }}
          KLYNDRO_KEY_ALIAS: ${{ secrets.KLYNDRO_KEY_ALIAS }}
          KLYNDRO_KEY_PASSWORD: ${{ secrets.KLYNDRO_KEY_PASSWORD }}
        run: ./scripts/release-android.sh

      - name: Build macOS release
        run: ./scripts/release-macos.sh

      - name: Generate SHA-256 checksums and resolve version
        id: meta
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/.derived/Build/Products/Release/Klyndro.app/Contents/Info.plist)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          (
            cd dist
            rm -f SHA256SUMS.txt
            shasum -a 256 Klyndro-macOS-*.dmg Klyndro-macOS-*.zip Klyndro-android-release*.apk > SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          assets=(
            "dist/Klyndro-macOS-${VERSION}.dmg"
            "dist/Klyndro-macOS-${VERSION}.zip"
            "dist/SHA256SUMS.txt"
          )
          if [[ -f "dist/Klyndro-android-release.apk" ]]; then
            assets+=("dist/Klyndro-android-release.apk")
            android_note="Android APK is signed with the release keystore."
          else
            assets+=("dist/Klyndro-android-release-UNSIGNED.apk")
            android_note="Android APK is **unsigned** (set repository secrets \`KLYNDRO_KEYSTORE_BASE64\`, \`KLYNDRO_KEYSTORE_PASSWORD\`, \`KLYNDRO_KEY_ALIAS\`, \`KLYNDRO_KEY_PASSWORD\` to publish an installable APK)."
          fi

          notes="$(printf '%s\n' \
            "Klyndro ${TAG}" \
            "" \
            "- macOS app is ad-hoc signed; on first launch on another Mac, allow it in **System Settings > Privacy & Security**." \
            "- ${android_note}" \
            "- Verify downloads against \`SHA256SUMS.txt\`.")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Klyndro ${TAG}" \
              --notes "$notes" \
              --generate-notes
          fi

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ runner.temp }}/klyndro-release.jks"
